# Brand/product-specific NFA data for the ventilation calculator's
# optional brand filter. Deliberately separate from content/components/
# — this is calculator input, not wiki content, and never surfaces on
# a component's reference page. The wiki stays product-agnostic
# ("what class of thing can replace it"); this file is what lets the
# calculator go one step further, when asked for, into "here's what
# GAF's actual ridge vent line requires."
#
# A starting set for the two brands already most present in this
# content (GAF, Lomanco — both already show up repeatedly in existing
# aliases), not a comprehensive catalog. Every entry is a real,
# researched current spec, not a reuse of the calculator's generic
# reference figures under a brand's name — but products change, get
# discontinued, and get re-rated, so treat every number here as
# something to reconfirm against the manufacturer's current published
# spec before relying on it, same discipline as everything else in
# this project.
